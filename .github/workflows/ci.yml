name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Read-only token for every job; nothing in CI needs to write to the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    # The oldest and newest PHP versions the test tools run on. (The plugin itself
    # supports PHP 7.4+; the php-74 job checks that every shipped file still parses there.)
    # The performance tests are part of the integration suite, so they run here too.
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit --no-coverage

      - name: Integration tests
        if: ${{ !cancelled() }}
        run: vendor/bin/phpunit --testsuite integration --no-coverage

      - name: Lint shipped PHP files
        if: ${{ !cancelled() && matrix.php == '8.5' }}
        run: bin/lint-php.sh

  php-74:
    name: PHP 7.4 Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint shipped PHP files
        run: bin/lint-php.sh

  static-analysis:
    # One Composer install for all three tools. Each step still runs if an earlier
    # one fails, so a single run reports every problem.
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

      - name: PHPStan (level 6)
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=4G

      - name: Psalm (level 4)
        if: ${{ !cancelled() }}
        run: vendor/bin/psalm --no-cache --php-version=8.2

  assets:
    # ESLint, Stylelint and the block build share one npm install.
    # (The committed build/ files are what ship; the build step proves they can be rebuilt.)
    name: JS & CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint admin/js/

      - name: Stylelint
        if: ${{ !cancelled() }}
        run: npx stylelint "admin/css/**/*.css"

      - name: Build blocks
        if: ${{ !cancelled() }}
        run: |
          npm run build
          for f in build/sidebar.js build/sidebar.asset.php build/blocks/toc/index.js build/blocks/faq/index.js build/blocks/howto/index.js; do
            [ -s "$f" ] || { echo "::error::Build did not produce $f"; exit 1; }
          done

  package:
    # Builds the exact zip that ships, checks it is complete and contains no dev
    # files, and keeps it as a downloadable artifact for every run.
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Version numbers agree
        run: bin/check-version.sh

      - name: Composer files are valid
        run: composer validate --no-check-publish --no-check-all

      - name: Build zip
        run: bin/build-zip.sh

      - name: Zip contents
        run: |
          unzip -Z1 dist/jat-search-intel.zip > files.txt
          for required in jat-search-intel/jat-search-intel.php jat-search-intel/readme.txt jat-search-intel/uninstall.php jat-search-intel/LICENSE.md; do
            grep -qx "$required" files.txt || { echo "::error::Missing from zip: $required"; exit 1; }
          done
          if grep -E '^jat-search-intel/(tests|vendor|node_modules|\.github|stubs|bin|dist)/|/\.(git|env)|phpunit|psalm|phpstan|composer\.(json|lock)$' files.txt; then
            echo "::error::Dev files found in the zip (listed above)"; exit 1
          fi
          echo "$(wc -l < files.txt) files, $(du -h dist/jat-search-intel.zip | cut -f1)"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: jat-search-intel
          path: dist/jat-search-intel.zip
          retention-days: 14

  plugin-check:
    # The official WordPress.org Plugin Check, run against the built zip.
    name: Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [package]
    steps:
      - name: Download zip
        uses: actions/download-artifact@v8
        with:
          name: jat-search-intel

      - name: Unzip
        run: unzip -q jat-search-intel.zip

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './jat-search-intel'

  # Playwright E2E tests are not run in CI to save Actions minutes.
  # Run locally: npx playwright test
