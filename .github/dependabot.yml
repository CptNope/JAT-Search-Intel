# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem so CI runs once. Major versions arrive as their own PRs, except
# WordPress packages, whose majors come together in one PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, github-actions]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # PHPUnit 10+ needs the tests rewritten, and 13 needs PHP 8.4, above the
      # oldest PHP the tests run on (8.1).
      - dependency-name: phpunit/phpunit
        update-types: [version-update:semver-major]
      # Psalm 7 needs PHP 8.2.27+ and reports working code as unused. Revisit when
      # the tests no longer run on PHP 8.1.
      - dependency-name: vimeo/psalm
        update-types: [version-update:semver-major]
    labels: [dependencies, php]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      wordpress-packages:
        patterns: ['@wordpress/*']
        update-types: [minor, patch]
      # WordPress releases its packages together, so their major versions
      # arrive as one PR instead of one per package.
      wordpress-majors:
        patterns: ['@wordpress/*']
        update-types: [major]
      other:
        patterns: ['*']
        exclude-patterns: ['@wordpress/*']
        update-types: [minor, patch]
    ignore:
      # Stylelint has to stay on the major version @wordpress/scripts supports
      # (stylelint-config-standard 41 needs stylelint 18; WordPress is on 17).
      - dependency-name: stylelint
        update-types: [version-update:semver-major]
      - dependency-name: stylelint-config-standard
        update-types: [version-update:semver-major]
    labels: [dependencies, javascript]
