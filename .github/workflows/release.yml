name: Release

# Two ways to publish a release:
# - Actions -> Release -> Run workflow: releases the version in the plugin header
#   of the chosen branch (normally main), creating the vX.Y.Z tag on that commit.
# - Pushing a vX.Y.Z tag: releases that tag.
# Either way the zip is built from that exact commit, the version numbers must
# agree, and the zip and its SHA-256 are attached before the release is
# published (releases are immutable once published).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Work out the tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(sed -n 's/^ \* Version:[[:space:]]*//p' jat-search-intel.php | head -1)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from ${GITHUB_SHA}"

      - name: Tag matches the plugin version
        run: bin/check-version.sh "${{ steps.tag.outputs.tag }}"

      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.tag.outputs.tag }} is already released. Bump the version to release again."
            exit 1
          fi

      - name: Build zip
        run: bin/build-zip.sh "${GITHUB_SHA}"

      - name: Checksum
        run: cd dist && sha256sum jat-search-intel.zip > jat-search-intel.zip.sha256 && cat jat-search-intel.zip.sha256

      - name: Release notes from readme.txt
        run: |
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          {
            echo "## What's new"
            echo
            awk -v v="= ${version} =" '
              $0 == v { found = 1; next }
              found && /^= [0-9]/ { exit }
              found && /^== / { exit }
              found { print }
            ' readme.txt
            echo
            echo "## Install"
            echo
            echo "Download **jat-search-intel.zip** below, then in WordPress go to **Plugins → Add New → Upload Plugin**. Check the download against **jat-search-intel.zip.sha256** if you like. Full documentation is in the [wiki](https://github.com/${GITHUB_REPOSITORY}/wiki)."
          } > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            dist/jat-search-intel.zip dist/jat-search-intel.zip.sha256 \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file notes.md \
            --latest
